<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מצפן נט - לוח בקרה</title>
    <link rel="stylesheet" href="./css/style.css">
        <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tinymce@6.8.5/tinymce.min.js" referrerpolicy="origin"></script>
        
        <style>
        /* ===== מתג שפה — מצפן נט ===== */
        .ms-lang{
          position:relative; display:inline-flex; align-items:center; gap:2px;
          padding:3px; border-radius:999px; direction:ltr;
          background:rgba(15,24,32,.06); border:1px solid rgba(15,24,32,.10);
          backdrop-filter:saturate(1.1);
        }
        .ms-lang-opt{
          position:relative; z-index:2; appearance:none; cursor:pointer;
          min-width:34px; height:30px; padding:0 10px; border:none; background:transparent;
          border-radius:999px; font:700 13px/1 'Noto Sans Hebrew','Tajawal',system-ui,sans-serif;
          color:#475560; letter-spacing:.2px;
          display:inline-flex; align-items:center; justify-content:center; gap:5px;
          transition:color .25s ease, transform .15s ease;
        }
        .ms-lang-opt .ms-lang-glyph{ font-size:14px; line-height:1; }
        .ms-lang-opt:hover:not(.is-active){ color:#09787a; background:rgba(12,167,170,.08); }
        .ms-lang-opt.is-active{ color:#fff; transform:translateY(-1px); }
        .ms-lang-opt:focus-visible{ outline:2px solid #0ca7aa; outline-offset:2px; }
        /* ה"גלולה" הפעילה — מונחת מאחורי הכפתור הפעיל ע"י JS, עובדת בכל כיוון */
        .ms-lang-thumb{
          position:absolute; z-index:1; top:3px; left:0; height:30px; width:34px;
          border-radius:999px; pointer-events:none;
          background:linear-gradient(135deg,#0ca7aa,#09787a);
          box-shadow:0 6px 16px -6px rgba(12,167,170,.7);
          transition:transform .32s cubic-bezier(.22,1,.36,1), width .32s cubic-bezier(.22,1,.36,1);
        }
        @media (prefers-reduced-motion:reduce){ .ms-lang-thumb{ transition:none; } }
        /* אנימציית מעבר שפה חלקה על כל המסך */
        html.ms-lang-switching body{ animation:msLangFade .42s ease; }
        @keyframes msLangFade{ 0%{opacity:.35; filter:saturate(.6)} 100%{opacity:1; filter:none} }
        </style>
        
</head>
<body>
    <!-- מסך טעינה -->
    <div class="loading-overlay" id="loadingOverlay" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(255,255,255,0.95);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;">
        <div class="spinner" style="width:48px;height:48px;border:4px solid #e2e8f0;border-top-color:#0ca7aa;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
        <div class="loading-text" style="margin-top:16px;color:#475569;font-size:14px;">⏳ טוען מערכת...</div>
    </div>
    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>

    <!-- מבנה האפליקציה (יוסתר עד לסיום הטעינה) -->
    <div class="app-layout" id="appLayout" style="display:none;">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">🧭</div>
                <div>
                    <div class="sidebar-title">מצפן נט</div>
                    <div class="sidebar-subtitle">מעקב פתרונות למידה</div>
                </div>
            </div>
            <nav class="sidebar-nav" id="sidebarNav"></nav>
            <div class="sidebar-footer">
                <div class="sidebar-user" id="sidebarUserInfo" onclick="App.showSection('settings')"></div>
                <button class="btn btn-ghost btn-block" style="margin-top:8px;color:#fca5a5;" onclick="Auth.logout()">🚪 התנתקות</button>
            </div>
        </aside>

        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <main class="main-content">
            <header class="app-header">
                <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
                <h1 class="header-title" id="headerTitle">📊 לוח בקרה</h1>
                <div id="activePeriodBadge" style="margin-right:auto;margin-left:8px;"></div>
                <div class="header-actions">
                                        <!-- מתג שפה: עברית / ערבית — ברמת המשתמש -->
                                        <div class="ms-lang" id="msLangSwitch" role="group" aria-label="בחירת שפה / اختيار اللغة">
                                          <span class="ms-lang-thumb" id="msLangThumb"></span>
                                          <button type="button" class="ms-lang-opt" data-lang="he" aria-pressed="false" title="עברית">
                                                <span class="ms-lang-glyph">א</span><span>עב</span>
                                          </button>
                                          <button type="button" class="ms-lang-opt" data-lang="ar" aria-pressed="false" title="العربية">
                                                <span class="ms-lang-glyph">ع</span><span>رب</span>
                                          </button>
                                        </div>
                    <button class="btn btn-outline btn-sm" onclick="window.print()">🖨️ הדפסה</button>
                </div>
            </header>

            <div class="page-content" id="pageContent">
                <div id="section-dashboard" class="section-page active"></div>
                <div id="section-solutions" class="section-page"></div>
                <div id="section-instructors" class="section-page"></div>
                <div id="section-guides" class="section-page"></div>
                <div id="section-guides-repo" class="section-page"></div>
                <div id="section-budgets" class="section-page"></div>
                <div id="section-periods" class="section-page"></div>
                <div id="section-lookup-tables" class="section-page"></div>
                <div id="section-registrations" class="section-page"></div>
                <div id="section-permissions" class="section-page"></div>
                <div id="section-activity-log" class="section-page"></div>
                <div id="section-recycle-bin" class="section-page"></div>
                <div id="section-homepage" class="section-page"></div>
                <div id="section-faq" class="section-page"></div>
                <div id="section-settings" class="section-page"></div>
                <div id="section-new-solution" class="section-page"></div>
                <div id="section-custom-pages" class="section-page"></div>
                <div id="section-import-export" class="section-page"></div>
            </div>

            <footer style="text-align:center;padding:16px;color:var(--gray-400);font-size:12px;border-top:1px solid var(--gray-200);background:white;">
                <span id="globalFooterText">© מצפן נט — משרד החינוך</span>
            </footer>
        </main>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">כותרת</h3>
                <button class="modal-close" onclick="App.closeModal()">✕</button>
                </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer" id="modalFooter"></div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- טעינת ספריות ואתחול המערכת (החלק הקריטי!) -->
    <!-- ========================================== -->
    <script src="./js/data.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/global-ui.js"></script>
    <script src="./js/app.js"></script>

    <script>
        console.log('[Dashboard] 📦 בדיקת טעינת קבצים...');
        console.log('[Dashboard] DataStore קיים:', typeof DataStore !== 'undefined');
        console.log('[Dashboard] App קיים:', typeof App !== 'undefined');

        function _startApp() {
            try {
                if (typeof App === 'undefined') {
                    console.error('[Dashboard] ❌ שגיאה קריטית: App לא הוגדר! ייתכן שגיאת תחביר ב-app.js או בעיית מטמון.');
                    document.getElementById('loadingOverlay').innerHTML = '<div style="text-align:center;color:#dc2626;"><h2>⚠️ שגיאת טעינה</h2><p>קובץ app.js לא נטען כראוי. נסה ללחוץ <strong>Ctrl + F5</strong>.</p></div>';
                    return;
                }
                
                console.log('[Dashboard] ✅ App נמצא, מאתחל את המערכת...');
                App.init();
                
                // הסתרת מסך הטעינה והצגת האפליקציה
                setTimeout(() => {
                    document.getElementById('loadingOverlay').style.display = 'none';
                    document.getElementById('appLayout').style.display = 'flex';
                }, 500);
            } catch (err) {
                console.error('[Dashboard] ❌ שגיאה בעת אתחול App:', err);
            }
        }

        if (typeof DataStore !== 'undefined') {
            console.log('[Dashboard] 🔄 מאתחל DataStore...');
            DataStore.init().then(() => {
                console.log('[Dashboard] ✅ DataStore מוכן.');
                _startApp();
            }).catch(err => {
                console.error('[Dashboard] ❌ שגיאה ב-DataStore:', err);
                _startApp(); // מנסה להמשיך בכל מקרה
            });
        } else {
            console.error('[Dashboard] ❌ DataStore לא הוגדר! בדוק את js/data.js');
        }

(function () {
    'use strict';
    var switchEl = document.getElementById('msLangSwitch');
    var thumb    = document.getElementById('msLangThumb');

    // מניח את ה"גלולה" מתחת לכפתור הפעיל (קורא מיקומים אמיתיים → עובד ב‑RTL וב‑LTR)
    function placeThumb() {
        if (!switchEl || !thumb) return;
        var active = switchEl.querySelector('.ms-lang-opt.is-active') ||
                     switchEl.querySelector('.ms-lang-opt[data-lang="he"]');
        if (!active) return;
        var r = active.getBoundingClientRect();
        var p = switchEl.getBoundingClientRect();
        thumb.style.width = r.width + 'px';
        thumb.style.transform = 'translateX(' + (r.left - p.left) + 'px)';
    }

    function wire() {
        if (!switchEl) return;
        switchEl.querySelectorAll('.ms-lang-opt').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var lang = btn.getAttribute('data-lang');
                // אנימציית מעבר חלקה
                document.documentElement.classList.add('ms-lang-switching');
                setTimeout(function () { document.documentElement.classList.remove('ms-lang-switching'); }, 460);
                if (window.setUiLang) window.setUiLang(lang);
                placeThumb();
            });
        });
        window.addEventListener('resize', placeThumb);
        // אם המערכת תחליף שפה ממקום אחר — ניישר את המתג
        document.addEventListener('matspanet:langchange', placeThumb);
    }

    function firstPaint() {
        if (window.applyUiLang) window.applyUiLang(window.getUiLang ? window.getUiLang() : 'he');
        placeThumb();
    }

    // המתג מוכן מיד
    if (document.readyState === 'loading')
        document.addEventListener('DOMContentLoaded', function () { wire(); placeThumb(); });
    else { wire(); placeThumb(); }

    // תרגום ראשוני ברגע שהתפריט נבנה (ה‑sidebar נוצר דינמית ע"י app.js)
    var sb = document.getElementById('sidebarNav');
    if (sb) {
        var done = false;
        var fire = function () { if (done) return; if (sb.children.length) { done = true; mo.disconnect(); firstPaint(); } };
        var mo = new MutationObserver(fire);
        mo.observe(sb, { childList: true });
        if (sb.children.length) fire();
        setTimeout(function () { if (!done) { done = true; mo.disconnect(); firstPaint(); } }, 1500); // רשת ביטחון
    } else {
        setTimeout(firstPaint, 400);
    }

    // הכותרת העליונה משתנה בכל ניווט — מתרגמים אותה אוטומטית בלי לגעת ב‑app.js
    var ht = document.getElementById('headerTitle');
    if (ht) {
        new MutationObserver(function () {
            if (window.__ms_translateHeader) window.__ms_translateHeader();
        }).observe(ht, { childList: true, characterData: true, subtree: true });
    }
})();
                
    </script>
</body>
</html>
